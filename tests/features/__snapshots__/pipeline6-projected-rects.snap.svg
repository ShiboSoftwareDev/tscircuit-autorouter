997,10 0.999998,10 0,9.999998 0,8.999999 0.000001,8 0.000002,7.000001 0.000003,6.000002 3.8499980000000003,6.1500010000000005" points="320.00005552491,44.75101099032588 264.4752010438706,44.750955465415814 208.9503465628312,44.75089994050586 153.42510340742174,44.75089994050586 97.90024892638235,44.75089994050586 42.37544997025293,44.75101099032588 42.37544997025293,100.27586547136525 42.37550549516293,155.80071995240468 42.375561020072944,211.3255744334441 42.37561654498295,266.8504289144835 256.1462424433382,258.52174793850105" fill="rgba(40, 140, 220, 0.06)" stroke="rgba(20, 70, 160, 0.95)" stroke-width="2.2209964002379765"/></g><g><circle data-type="point" data-label="net1" data-x="1" data-y="1" cx="97.90035997620234" cy="544.4750899940506" r="3" fill="rgba(30, 30, 30, 0.85)"/></g><g><circle data-type="point" data-label="net1" data-x="3.8573016155852944" data-y="3.662640145581492" cx="256.55177504142966" cy="396.63223553241016" r="3" fill="rgba(30, 30, 30, 0.85)"/></g><g><circle data-type="point" data-label="net1" data-x="3.8573016155852944" data-y="3.662640145581492" cx="256.55177504142966" cy="396.63223553241016" r="3" fill="rgba(30, 30, 30, 0.85)"/></g><g><circle data-type="point" data-label="net1" data-x="6.190425392897658" data-y="3.6669080932011444" cx="386.0982628094394" cy="396.3952581249189" r="3" fill="rgba(30, 30, 30, 0.85)"/></g><g><circle data-type="point" data-label="net2" data-x="8.819702494272134" data-y="3.9540155083995723" cx="532.0886372439608" cy="380.4536447339854" r="3" fill="rgba(30, 30, 30, 0.85)"/></g><g><circle data-type="point" data-label="net2" data-x="9" data-y="1" cx="542.0996400237977" cy="544.4750899940506" r="3" fill="rgba(30, 30, 30, 0.85)"/></g><g><circle data-type="point" data-label="net1" data-x="6.190425392897658" data-y="3.6669080932011444" cx="386.0982628094394" cy="396.3952581249189" r="3" fill="rgba(30, 30, 30, 0.85)"/></g><g><circle data-type="point" data-label="net1" data-x="8.323234164757379" data-y="3.9346721694665243" cx="504.52227792684994" cy="381.5276818874575" r="3" fill="rgba(30, 30, 30, 0.85)"/></g><g><circle data-type="point" data-label="net2" data-x="6.190419745652478" data-y="6.333090828918095" cx="386.097949246659" cy="248.35570166481915" r="3" fill="rgba(30, 30, 30, 0.85)"/></g><g><circle data-type="point" data-label="net2" data-x="8.819702494272134" data-y="3.9540155083995723" cx="532.0886372439608" cy="380.4536447339854" r="3" fill="rgba(30, 30, 30, 0.85)"/></g><g><circle data-type="point" data-label="net1" data-x="8.323234164757379" data-y="3.9346721694665243" cx="504.52227792684994" cy="381.5276818874575" r="3" fill="rgba(30, 30, 30, 0.85)"/></g><g><circle data-type="point" data-label="net1" data-x="9" data-y="9" cx="542.0996400237977" cy="100.27580994645524" r="3" fill="rgba(30, 30, 30, 0.85)"/></g><g><circle data-type="point" data-label="net2" data-x="3.9036618020035476" data-y="6.329657467611172" cx="259.12592022016224" cy="248.54633874240398" r="3" fill="rgba(30, 30, 30, 0.85)"/></g><g><circle data-type="point" data-label="net2" data-x="6.190419745652478" data-y="6.333090828918095" cx="386.097949246659" cy="248.35570166481915" r="3" fill="rgba(30, 30, 30, 0.85)"/></g><g><circle data-type="point" data-label="net2" data-x="1" data-y="9" cx="97.90035997620234" cy="100.27580994645524" r="3" fill="rgba(30, 30, 30, 0.85)"/></g><g><circle data-type="point" data-label="net2" data-x="3.9036618020035476" data-y="6.329657467611172" cx="259.12592022016224" cy="248.54633874240398" r="3" fill="rgba(30, 30, 30, 0.85)"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":55.524910005949415,"c":0,"e":42.37544997025293,"b":0,"d":-55.524910005949415,"f":600};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>